name: Python 3.14 dashboard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install website dependencies from wheels
        run: python -m pip install --only-binary=:all: -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Install the existing test runner
        run: python -m pip install pytest==9.2.0
      - name: Test the dashboard without research dependencies or SQLite
        run: python -m pytest tests/test_dashboard.py -q
